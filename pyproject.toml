[project]
name = "mouse-colony-management-gui"
version = "0.3.0"
description = "Minimal local-first mouse colony and cage management GUI"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.116.1,<1",
    "jinja2>=3.1.6,<4",
    "openpyxl>=3.1.5,<4",
    "pydantic>=2.11.7,<3",
    "pydantic-settings>=2.10.1,<3",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1",
    "mypy>=1.17.0,<2",
    "pytest>=8.4.1,<9",
    "pytest-asyncio>=1.1.0,<2",
    "ruff>=0.12.5,<1",
]

[project.scripts]
mouseline = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true
